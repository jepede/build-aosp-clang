name: Build AOSP Clang 14/17/18/19/22 for Linux AArch64
run-name: Build 5 AOSP Clang kernel revisions as native Linux ARM64/glibc
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-aosp-clang-linux-arm64-multi.yml
      - scripts/build-aosp-clang-linux-arm64-multi.sh
      - scripts/smoke-clang-linux-arm64-multi.py
      - source-locks/**
  workflow_dispatch:
    inputs:
      ninja_jobs:
        description: Native AArch64 compile concurrency (1-4)
        default: "3"
        required: true
permissions:
  contents: read
concurrency:
  group: aosp-clang-multi-linux-aarch64
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.revision }} Linux glibc
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        revision: [r450784e, r487747c, r510928, r536225, r584948c]
    env:
      JOBS: ${{ inputs.ninja_jobs || '3' }}
      CC: gcc-12
      CXX: g++-12
      HOST_GCC_TOOLCHAIN: /usr
      CCACHE_DIR: ${{ github.workspace }}/.ccache-${{ matrix.revision }}
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPRESS: "true"
    steps:
      - uses: actions/checkout@v4
      # AOSP r584948c's pinned llvm_tools uses enum.StrEnum,
      # which was added in Python 3.11; Ubuntu 22.04 defaults to 3.10.
      - name: Select Python 3.12 for AOSP Clang 22
        if: ${{ matrix.revision == 'r584948c' }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Install native ARM64 Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-12 g++-12 binutils cmake ninja-build ccache git curl \
            ca-certificates python3 xz-utils zlib1g-dev file patch
      - name: Restore version-isolated compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache-${{ matrix.revision }}
          key: aosp-${{ matrix.revision }}-aarch64-${{ hashFiles('scripts/build-aosp-clang-linux-arm64-multi.sh') }}
          restore-keys: aosp-${{ matrix.revision }}-aarch64-
      - name: Shell and Python syntax preflight
        run: |
          bash -n scripts/build-aosp-clang-linux-arm64-multi.sh
          python3 -m py_compile scripts/smoke-clang-linux-arm64-multi.py
      - name: Fetch pinned AOSP sources, build, and smoke test
        run: |
          set -o pipefail
          bash scripts/build-aosp-clang-linux-arm64-multi.sh '${{ matrix.revision }}' \
            2>&1 | tee "build-${{ matrix.revision }}.log"
      - name: Upload SHA256 and original archive metadata
        uses: actions/upload-artifact@v4
        with:
          name: aosp-clang-${{ matrix.revision }}-linux-aarch64-manifest
          path: |
            out/${{ matrix.revision }}/*.sha256
            out/${{ matrix.revision }}/*.size
          if-no-files-found: error
          retention-days: 400
          compression-level: 0

      - name: Upload toolchain part 00
        uses: actions/upload-artifact@v4
        with:
          name: aosp-clang-${{ matrix.revision }}-linux-aarch64-part-00
          path: out/${{ matrix.revision }}/*.part.00
          if-no-files-found: error
          retention-days: 400
          compression-level: 0

      - name: Upload toolchain part 01
        if: ${{ hashFiles('out/**/*.part.01') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: aosp-clang-${{ matrix.revision }}-linux-aarch64-part-01
          path: out/${{ matrix.revision }}/*.part.01
          if-no-files-found: error
          retention-days: 400
          compression-level: 0

      - name: Upload toolchain part 02
