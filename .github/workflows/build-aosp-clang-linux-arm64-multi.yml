      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aosp-clang-${{ matrix.revision }}-linux-aarch64-evidence
          path: |
            source-locks/${{ matrix.revision }}.json
            build-${{ matrix.revision }}.log
            .aosp-clang-${{ matrix.revision }}-work/build/CMakeCache.txt
            .aosp-clang-${{ matrix.revision }}-work/build/CMakeFiles/CMakeError.log
            .aosp-clang-${{ matrix.revision }}-work/stage/clang-${{ matrix.revision }}-linux-aarch64/BUILD_INFO.json
            .aosp-clang-${{ matrix.revision }}-work/stage/clang-${{ matrix.revision }}-linux-aarch64/smoke-results.json
            .aosp-clang-${{ matrix.revision }}-work/patch-manager.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 400
