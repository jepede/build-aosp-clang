name: Build gdbserver (aarch64)
run-name: gdbserver aarch64 for GDB ${{ inputs.gdb_version }} / NDK ${{ inputs.ndk_version }} / API ${{ inputs.android_api }}

on:
  workflow_dispatch:
    inputs:
      gdb_version:
        description: "GDB 版本（例如 14.2）"
        required: true
        default: "14.2"
      ndk_version:
        description: "NDK 版本（例如 r28c / r29-beta3）"
        required: true
        default: "r28c"
      android_api:
        description: "Android API（≥21，建议25+）"
        required: true
        default: "25"
      link_static:
        description: "是否尝试静态链接（可能因缺少静态库失败）"
        required: true
        type: choice
        options: ["false","true"]
        default: "false"
      extra_cflags:
        description: "额外 CFLAGS（可留空）"
        required: false
        default: ""
      extra_ldflags:
        description: "额外 LDFLAGS（可留空）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ROOTDIR: ${{ github.workspace }}
      TARGET: aarch64-linux-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl xz-utils tar unzip git file tree make gcc g++ pkg-config

      - name: Download Android NDK (${{ inputs.ndk_version }})
        run: |
          set -eux
          curl -fL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-${{ inputs.ndk_version }}-linux.zip"
          unzip -q ndk.zip
          mv "android-ndk-${{ inputs.ndk_version }}" "$ROOTDIR/ndk"
          rm -f ndk.zip
          echo "NDK ready."

      - name: Prepare toolchain
        id: tc
        run: |
          set -eux
          API="${{ inputs.android_api }}"
          TC="$ROOTDIR/ndk/toolchains/llvm/prebuilt/linux-x86_64"
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "tc=$TC" >> "$GITHUB_OUTPUT"
          echo "TRIPLE=${{ env.TARGET }}$API" >> "$GITHUB_OUTPUT"

      - name: Download GDB source (${{ inputs.gdb_version }})
        run: |
          set -eux
          GDBV="${{ inputs.gdb_version }}"
          # 官方发布包（包含所需的 gnulib、生成的 configure）
          URL_PRIMARY="https://ftp.gnu.org/gnu/gdb/gdb-${GDBV}.tar.xz"
          URL_MIRROR="https://sourceware.org/pub/gdb/releases/gdb-${GDBV}.tar.xz"
          curl -fL "$URL_PRIMARY" -o gdb.tar.xz || curl -fL "$URL_MIRROR" -o gdb.tar.xz
          tar -xf gdb.tar.xz
          rm -f gdb.tar.xz
          echo "GDB source unpacked."

      - name: Configure & build gdbserver (cross-compile)
        run: |
          set -eux
          API="${{ inputs.android_api }}"
          TC="$ROOTDIR/ndk/toolchains/llvm/prebuilt/linux-x86_64"
          TRIPLE="aarch64-linux-android${API}"
          TARGET="aarch64-linux-android"
          
          export PATH="$TC/bin:$PATH"
          export CC="$TC/bin/${TRIPLE}-clang"
          export CXX="$TC/bin/${TRIPLE}-clang++"
          export AR="$TC/bin/llvm-ar"
          export RANLIB="$TC/bin/llvm-ranlib"
          export STRIP="$TC/bin/llvm-strip"
          export LD="$TC/bin/ld.lld"
          export READELF="$TC/bin/llvm-readelf"
          export OBJCOPY="$TC/bin/llvm-objcopy"
          export OBJDUMP="$TC/bin/llvm-objdump"
          export PKG_CONFIG_LIBDIR=
          export PKG_CONFIG_PATH=
          
          LDFLAGS_EXTRA="${{ inputs.extra_ldflags }}"
          CFLAGS_EXTRA="${{ inputs.extra_cflags }}"
          if [ "${{ inputs.link_static }}" = "true" ]; then
            LDFLAGS_EXTRA="$LDFLAGS_EXTRA -static"
          fi
          
          mkdir -p "$ROOTDIR/build" "$ROOTDIR/out"
          
          # ---- 关键修正：自动探测 gdbserver 源目录（顶层 or gdb/ 子目录）----
          GDB_SRC="$ROOTDIR/gdb-${{ inputs.gdb_version }}"
          if [ -x "$GDB_SRC/gdbserver/configure" ]; then
            SRCDIR="$GDB_SRC/gdbserver"                 # 新布局：gdbserver/（GDB ≥ 10）
          elif [ -x "$GDB_SRC/gdb/gdbserver/configure" ]; then
            SRCDIR="$GDB_SRC/gdb/gdbserver"             # 旧布局：gdb/gdbserver/
          else
            echo "找不到 gdbserver 源目录（既没有 gdbserver/ 也没有 gdb/gdbserver/）"
            echo "实际解包内容："; ls -la "$GDB_SRC" | head -n 200
            exit 1
          fi
          cd "$SRCDIR"
          
          # 按官方推荐 cross 方式直接在 gdbserver 子目录 configure（对 Android 最省事）
          CC_FOR_BUILD=gcc \
          CFLAGS="$CFLAGS_EXTRA" \
          LDFLAGS="$LDFLAGS_EXTRA" \
          ./configure --host="$TARGET" --disable-nls
          
          make -j"$(nproc)"
          
          cp -f gdbserver "$ROOTDIR/out/gdbserver-aarch64"
          "$STRIP" -s "$ROOTDIR/out/gdbserver-aarch64" || true
          
          file "$ROOTDIR/out/gdbserver-aarch64"
          echo "Built gdbserver:"
          "$READELF" -h "$ROOTDIR/out/gdbserver-aarch64" | head -n 30 || true

      - name: Pack artifact
        run: |
          set -eux
          GDBV="${{ inputs.gdb_version }}"
          NDKV="${{ inputs.ndk_version }}"
          API="${{ inputs.android_api }}"
          NAME="gdbserver-aarch64-gdb${GDBV}-ndk${NDKV}-api${API}"
          mkdir -p pkg
          cp out/gdbserver-aarch64 "pkg/${NAME}"
          tar -c -C pkg "${NAME}" | xz -T0 -v > "${NAME}.tar.xz"
          echo "tarball=${NAME}.tar.xz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.tarball }}
          path: ${{ env.tarball }}
          retention-days: 7
