name: 构建 AOSP Clang Android arm64

run-name: 构建 AOSP Clang ${{ inputs.aosp_rev || 'r416183b' }} -> Android arm64 / NDK ${{ inputs.ndk_version || 'r28c' }}

on:
  workflow_dispatch:
    inputs:
      ndk_version:
        description: "NDK 版本，例如 r28c"
        default: "r28c"
        required: true

      aosp_rev:
        description: "AOSP Clang 版本，例如 r416183b"
        default: "r416183b"
        required: true

      android_platform:
        description: "Android API，例如 23 / 24 / 30"
        default: "30"
        required: true

      llvm_project_ref:
        description: "可选：toolchain/llvm-project 提交/分支；留空时 r416183b 自动使用固定提交"
        default: ""
        required: false

      llvm_android_ref:
        description: "可选：toolchain/llvm_android 提交/分支；留空时 r416183b 自动使用固定提交"
        default: ""
        required: false

      ninja_jobs:
        description: "Ninja 并行数；GitHub 标准 runner 建议 1 或 2"
        default: "1"
        required: true

      xz_level:
        description: "xz 压缩等级；建议 3~6，不要太高"
        default: "6"
        required: true

permissions:
  contents: read

concurrency:
  group: aosp-clang-${{ github.ref }}-${{ inputs.aosp_rev || 'r416183b' }}-${{ inputs.ndk_version || 'r28c' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      ROOTDIR: ${{ github.workspace }}
      SRC_DIR: ${{ github.workspace }}/src
      HOST_BUILD_DIR: ${{ github.workspace }}/build-host-tools
      BUILD_DIR: ${{ github.workspace }}/build-android
      INSTALL_DIR: ${{ github.workspace }}/stage/aarch64-linux-android
      OUT_DIR: ${{ github.workspace }}/out
      TARGET_TRIPLE: aarch64-linux-android
      AOSP_REV: ${{ inputs.aosp_rev || 'r416183b' }}
      NDK_VERSION: ${{ inputs.ndk_version || 'r28c' }}
      ANDROID_PLATFORM: ${{ inputs.android_platform || '30' }}
      NINJA_JOBS: ${{ inputs.ninja_jobs || '1' }}
      XZ_LEVEL: ${{ inputs.xz_level || '6' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ inputs.ninja_jobs || '1' }}

    steps:
      - name: 最大化可用磁盘空间与 Swap
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 6144
          temp-reserve-mb: 1024
          swap-size-mb: 12288
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: 检出当前仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - name: 安装依赖
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y \
            ninja-build \
            cmake \
            xz-utils \
            unzip \
            git \
            curl \
            file \
            tree \
            pkg-config \
            jq \
            patch \
            ccache \
            python3

      - name: 校验构建输入
        run: |
          set -euo pipefail

          [[ "$NDK_VERSION" =~ ^r[0-9]+[a-z]?$ ]] || {
            echo "无效 NDK_VERSION: $NDK_VERSION"
            exit 1
          }

          [[ "$AOSP_REV" =~ ^r[0-9]+[a-z]?$ ]] || {
            echo "无效 AOSP_REV: $AOSP_REV"
            exit 1
          }

          [[ "$ANDROID_PLATFORM" =~ ^[0-9]+$ ]] || {
            echo "无效 ANDROID_PLATFORM: $ANDROID_PLATFORM"
            exit 1
          }

          [[ "$NINJA_JOBS" =~ ^[0-9]+$ ]] && [ "$NINJA_JOBS" -ge 1 ] && [ "$NINJA_JOBS" -le 4 ] || {
            echo "NINJA_JOBS 必须是 1~4"
            exit 1
          }

          [[ "$XZ_LEVEL" =~ ^[0-9]+$ ]] && [ "$XZ_LEVEL" -ge 0 ] && [ "$XZ_LEVEL" -le 9 ] || {
            echo "XZ_LEVEL 必须是 0~9"
            exit 1
          }

          echo "AOSP_REV=$AOSP_REV"
          echo "NDK_VERSION=$NDK_VERSION"
          echo "ANDROID_PLATFORM=$ANDROID_PLATFORM"
          echo "NINJA_JOBS=$NINJA_JOBS"
          echo "XZ_LEVEL=$XZ_LEVEL"

      - name: 启用 ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: aosp-clang-${{ env.AOSP_REV }}-${{ env.NDK_VERSION }}-android-arm64
          max-size: 2G

      - name: 资源自检
        run: |
          set -euo pipefail
          df -h
          free -h || true
          nproc || true
          ulimit -n 1048576 || true
          ccache --version || true
          cmake --version
          ninja --version

      - name: 下载并解压 NDK
        run: |
          set -euo pipefail

          curl -fsSL \
            -o "$ROOTDIR/android-ndk.zip" \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"

          unzip -q "$ROOTDIR/android-ndk.zip" -d "$ROOTDIR"
          rm -f "$ROOTDIR/android-ndk.zip"

          ln -sfn "$ROOTDIR/android-ndk-${NDK_VERSION}" "$ROOTDIR/ndk"

          ls -la "$ROOTDIR/ndk"
          ls -la "$ROOTDIR/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin" | sed -n '1,80p'

      - name: 克隆 AOSP LLVM 源码并锁定版本
        env:
          INPUT_LLVM_PROJECT_REF: ${{ inputs.llvm_project_ref }}
          INPUT_LLVM_ANDROID_REF: ${{ inputs.llvm_android_ref }}
        run: |
          set -euo pipefail

          mkdir -p "$SRC_DIR"

          LLVM_PROJECT_REF="$INPUT_LLVM_PROJECT_REF"
          LLVM_ANDROID_REF="$INPUT_LLVM_ANDROID_REF"

          case "$AOSP_REV" in
            r416183b)
              if [ -z "$LLVM_PROJECT_REF" ]; then
                LLVM_PROJECT_REF="c935d99d7cf2016289302412d708641d52d2f7ee"
              fi

              if [ -z "$LLVM_ANDROID_REF" ]; then
                LLVM_ANDROID_REF="07e984be2f6074fb044e0ae06b9027f350fe8844"
              fi
              ;;
            *)
              if [ -z "$LLVM_PROJECT_REF" ] || [ -z "$LLVM_ANDROID_REF" ]; then
                echo "当前只内置了 r416183b 的固定提交。"
                echo "如果你要编译 $AOSP_REV，请手动填写 llvm_project_ref 和 llvm_android_ref。"
                exit 1
              fi
              ;;
          esac

          echo "AOSP_REV=$AOSP_REV"
          echo "LLVM_PROJECT_REF=$LLVM_PROJECT_REF"
          echo "LLVM_ANDROID_REF=$LLVM_ANDROID_REF"

          git init "$SRC_DIR/llvm-project"
          git -C "$SRC_DIR/llvm-project" remote add origin https://android.googlesource.com/toolchain/llvm-project
          git -C "$SRC_DIR/llvm-project" fetch --depth 1 origin "$LLVM_PROJECT_REF"
          git -C "$SRC_DIR/llvm-project" checkout --detach FETCH_HEAD

          git init "$SRC_DIR/llvm_android"
          git -C "$SRC_DIR/llvm_android" remote add origin https://android.googlesource.com/toolchain/llvm_android
          git -C "$SRC_DIR/llvm_android" fetch --depth 1 origin "$LLVM_ANDROID_REF"
          git -C "$SRC_DIR/llvm_android" checkout --detach FETCH_HEAD

          echo "llvm-project full sha:"
          git -C "$SRC_DIR/llvm-project" rev-parse HEAD

          echo "llvm_android full sha:"
          git -C "$SRC_DIR/llvm_android" rev-parse HEAD

      - name: 应用 AOSP llvm_android 补丁
        run: |
          set -euo pipefail

          REV_NUM="$(echo "$AOSP_REV" | sed -E 's/^r([0-9]+).*/\1/')"

          if [ -z "$REV_NUM" ]; then
            echo "无法从 $AOSP_REV 解析版本号"
            exit 1
          fi

          echo "svn revision = $REV_NUM"

          PATCH_ROOT="$SRC_DIR/llvm_android/patches"
          PATCHES_JSON="$PATCH_ROOT/PATCHES.json"

          if [ ! -f "$PATCHES_JSON" ]; then
            echo "找不到 PATCHES.json: $PATCHES_JSON"
            exit 1
          fi

          git -C "$SRC_DIR/llvm-project" reset --hard
          git -C "$SRC_DIR/llvm-project" clean -fdx
          git -C "$SRC_DIR/llvm-project" config user.email "actions@github.com"
          git -C "$SRC_DIR/llvm-project" config user.name "GitHub Actions"

          mapfile -t PATCHES < <(
            jq -r --argjson R "$REV_NUM" '
              .[]
              | select((.platforms // ["android"]) | index("android"))
              | (.version_range.from // .start_version // -1) as $from
              | (.version_range.until // .end_version // null) as $until
              | select(($from <= $R) and (($until == null) or ($R < $until)))
              | (.rel_patch_path // .patch // .path // empty)
            ' "$PATCHES_JSON" | sed '/^$/d'
          )

          echo "候选补丁数量: ${#PATCHES[@]}"

          for p in "${PATCHES[@]}"; do
            PP="$PATCH_ROOT/$p"

            if [ ! -f "$PP" ]; then
              echo "跳过不存在的补丁: $p"
              continue
            fi

            echo ">> 应用补丁: $p"

            if git -C "$SRC_DIR/llvm-project" am --keep-cr "$PP"; then
              continue
            fi

            git -C "$SRC_DIR/llvm-project" am --abort || true

            if patch -p1 --forward --input="$PP" -d "$SRC_DIR/llvm-project"; then
              echo "patch fallback 成功: $p"
            else
              echo "补丁失败: $p"
              exit 1
            fi
          done

          echo "补丁应用完成"
          git -C "$SRC_DIR/llvm-project" status --short

      - name: 修复旧 LLVM 宿主编译兼容性
        run: |
          set -euo pipefail

          SIGNALS_H="$SRC_DIR/llvm-project/llvm/include/llvm/Support/Signals.h"
          test -f "$SIGNALS_H"

          python3 - "$SIGNALS_H" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          if "#include <cstdint>\n" not in text:
              marker = "#include <string>\n"
              if marker not in text:
                  raise SystemExit(f"找不到插入位置: {path}")
              text = text.replace(marker, "#include <cstdint>\n" + marker, 1)
              path.write_text(text, encoding="utf-8")

          if "#include <cstdint>\n" not in path.read_text(encoding="utf-8"):
              raise SystemExit(f"宿主兼容补丁应用失败: {path}")
          PY

          grep -n -E '^#include <(cstdint|string)>$' "$SIGNALS_H"

      - name: 构建 native TableGen 工具
        run: |
          set -euo pipefail

          mkdir -p "$HOST_BUILD_DIR"

          cmake -S "$SRC_DIR/llvm-project/llvm" -B "$HOST_BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

          ninja -C "$HOST_BUILD_DIR" -j"$NINJA_JOBS" -l"$NINJA_JOBS" llvm-tblgen clang-tblgen

          test -x "$HOST_BUILD_DIR/bin/llvm-tblgen"
          test -x "$HOST_BUILD_DIR/bin/clang-tblgen"

          file "$HOST_BUILD_DIR/bin/llvm-tblgen"
          file "$HOST_BUILD_DIR/bin/clang-tblgen"

      - name: 配置 Android arm64 交叉构建
        env:
          ANDROID_NDK_HOME: ${{ github.workspace }}/ndk
          ANDROID_NDK_ROOT: ${{ github.workspace }}/ndk
        run: |
          set -euo pipefail

          API="$ANDROID_PLATFORM"
          TOOLCHAIN="$ROOTDIR/ndk/toolchains/llvm/prebuilt/linux-x86_64"

          export CC="$TOOLCHAIN/bin/${TARGET_TRIPLE}${API}-clang"
          export CXX="$TOOLCHAIN/bin/${TARGET_TRIPLE}${API}-clang++"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export STRIP="$TOOLCHAIN/bin/llvm-strip"
          export LD="$TOOLCHAIN/bin/ld.lld"

          mkdir -p "$BUILD_DIR" "$INSTALL_DIR"

          cmake -S "$SRC_DIR/llvm-project/llvm" -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ROOTDIR/ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="$API" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR" \
            -DLLVM_NATIVE_TOOL_DIR="$HOST_BUILD_DIR/bin" \
            -DLLVM_TABLEGEN="$HOST_BUILD_DIR/bin/llvm-tblgen" \
            -DCLANG_TABLEGEN="$HOST_BUILD_DIR/bin/clang-tblgen" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_DEFAULT_TARGET_TRIPLE="$TARGET_TRIPLE" \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_BACKTRACES=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_PARALLEL_LINK_JOBS=1 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS="-fvisibility=hidden -fdata-sections -ffunction-sections" \
            -DCMAKE_CXX_FLAGS="-fvisibility=hidden -fdata-sections -ffunction-sections" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--gc-sections -latomic" \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,--gc-sections -latomic"

          cmake --build "$BUILD_DIR" --target help | sed -n '1,200p' || true

      - name: 构建 clang / lld / 常用 llvm 工具
        timeout-minutes: 300
        run: |
          set -euo pipefail

          JOBS="$NINJA_JOBS"

          (
            while true; do
              echo "::notice::keepalive $(date)"
              df -h || true
              free -h || true
              ccache -s || true
              sleep 120
            done
          ) &
          KEEPALIVE_PID="$!"

          cleanup() {
            kill "$KEEPALIVE_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          build_required() {
            local target="$1"
            echo "==== build required target: $target ===="
            ninja -C "$BUILD_DIR" -j"$JOBS" -l"$JOBS" "$target"
          }

          build_optional() {
            local target="$1"
            echo "==== build optional target: $target ===="
            if ninja -C "$BUILD_DIR" -j"$JOBS" -l"$JOBS" "$target"; then
              echo "optional target ok: $target"
            else
              echo "optional target skipped/failed: $target"
            fi
          }

          build_required clang
          build_required lld

          build_optional clang-resource-headers
          build_optional llvm-ar
          build_optional llvm-ranlib
          build_optional llvm-strip
          build_optional llvm-nm
          build_optional llvm-objdump
          build_optional llvm-readelf
          build_optional llvm-objcopy
          build_optional llvm-size
          build_optional llvm-strings

          ccache -s || true

      - name: 整理最小可用工具链目录
        run: |
          set -euo pipefail

          rm -rf "$INSTALL_DIR"
          mkdir -p "$INSTALL_DIR/bin" "$INSTALL_DIR/lib" "$INSTALL_DIR/share"

          copy_bin() {
            local name="$1"
            local src="$BUILD_DIR/bin/$name"
            local dest="$INSTALL_DIR/bin/$name"

            if [ ! -e "$src" ] && [ ! -L "$src" ]; then
              return 1
            fi

            if [ -L "$src" ]; then
              local resolved
              local target_name

              if ! resolved="$(readlink -f "$src")"; then
                echo "无法解析符号链接: $src -> $(readlink "$src")"
                return 1
              fi
              if [ ! -f "$resolved" ]; then
                echo "符号链接目标不存在: $src -> $(readlink "$src")"
                return 1
              fi

              target_name="$(basename "$resolved")"
              if [ ! -e "$INSTALL_DIR/bin/$target_name" ]; then
                cp -a "$resolved" "$INSTALL_DIR/bin/$target_name"
              fi
              ln -sfn "$target_name" "$dest"
            else
              cp -a "$src" "$dest"
            fi

            return 0
          }

          copy_bin clang
          copy_bin lld

          copy_bin clang++ || ln -s clang "$INSTALL_DIR/bin/clang++"
          copy_bin clang-cpp || true

          copy_bin ld.lld || ln -s lld "$INSTALL_DIR/bin/ld.lld"
          copy_bin ld64.lld || true
          copy_bin wasm-ld || true

          copy_bin llvm-ar || true
          copy_bin llvm-ranlib || true
          copy_bin llvm-strip || true
          copy_bin llvm-nm || true
          copy_bin llvm-objdump || true
          copy_bin llvm-readelf || true
          copy_bin llvm-objcopy || true
          copy_bin llvm-size || true
          copy_bin llvm-strings || true

          if [ -d "$BUILD_DIR/lib/clang" ]; then
            cp -a "$BUILD_DIR/lib/clang" "$INSTALL_DIR/lib/"
          else
            echo "警告：没有找到 $BUILD_DIR/lib/clang"
            echo "尝试手动整理 clang resource headers"

            VERSION_INC="$(find "$BUILD_DIR" -path '*/clang/Basic/Version.inc' -print -quit)"

            if [ -n "$VERSION_INC" ] && [ -f "$VERSION_INC" ]; then
              MAJOR="$(grep 'CLANG_VERSION_MAJOR' "$VERSION_INC" | awk '{print $3}' | tr -d '"')"
              MINOR="$(grep 'CLANG_VERSION_MINOR' "$VERSION_INC" | awk '{print $3}' | tr -d '"')"
              PATCH="$(grep 'CLANG_VERSION_PATCHLEVEL' "$VERSION_INC" | awk '{print $3}' | tr -d '"')"
              CLANG_VER="${MAJOR}.${MINOR}.${PATCH}"
            else
              CLANG_VER="unknown"
            fi

            mkdir -p "$INSTALL_DIR/lib/clang/$CLANG_VER/include"
            cp -a "$SRC_DIR/llvm-project/clang/lib/Headers/." "$INSTALL_DIR/lib/clang/$CLANG_VER/include/"
          fi

          cat > "$INSTALL_DIR/README.txt" <<EOF
          AOSP Clang Android arm64 build

          aosp_rev: $AOSP_REV
          ndk_version: $NDK_VERSION
          android_platform: $ANDROID_PLATFORM
          target_triple: $TARGET_TRIPLE

          注意：
          1. 这里产物是 Android arm64 ELF，不能直接在 GitHub Ubuntu runner 上执行。
          2. bin/clang、bin/lld 应放到 Android arm64 环境运行。
          3. lib/clang 是 clang resource dir，不能删。
          EOF

          echo "==== staged files ===="
          tree -L 4 "$INSTALL_DIR" || true

          echo "==== ELF check ===="
          find "$INSTALL_DIR/bin" -maxdepth 1 -type f -print0 | while IFS= read -r -d '' f; do
            echo "---- $f"
            file "$f" || true
          done

          echo "==== strip Android ELF binaries ===="
          STRIPPER="$ROOTDIR/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"

          find "$INSTALL_DIR/bin" -maxdepth 1 -type f -print0 | while IFS= read -r -d '' f; do
            if file "$f" | grep -q 'ELF'; then
              "$STRIPPER" -s "$f" || true
            fi
          done

          mapfile -d '' -t DANGLING_LINKS < <(
            find "$INSTALL_DIR/bin" -maxdepth 1 -xtype l -print0
          )
          if [ "${#DANGLING_LINKS[@]}" -ne 0 ]; then
            printf '发现悬空符号链接: %s\n' "${DANGLING_LINKS[@]}"
            exit 1
          fi

          for required_bin in clang lld; do
            if [ ! -x "$INSTALL_DIR/bin/$required_bin" ]; then
              echo "必需工具不可执行或不存在: $INSTALL_DIR/bin/$required_bin"
              exit 1
            fi
          done

          if [ ! -d "$INSTALL_DIR/lib/clang" ]; then
            echo "缺少 clang resource 目录: $INSTALL_DIR/lib/clang"
            exit 1
          fi

          RESOURCE_STDDEF="$(find "$INSTALL_DIR/lib/clang" -path '*/include/stddef.h' -print -quit)"
          if [ -z "$RESOURCE_STDDEF" ]; then
            echo "clang resource headers 中缺少 stddef.h"
            exit 1
          fi

          READELF="$ROOTDIR/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$READELF" -h "$INSTALL_DIR/bin/clang" | grep -E 'Class:|Machine:'
          "$READELF" -h "$INSTALL_DIR/bin/lld" | grep -E 'Class:|Machine:'

      - name: 打包
        id: pack
        run: |
          set -euo pipefail

          API="$ANDROID_PLATFORM"

          mkdir -p "$OUT_DIR"

          TAR_NAME="aosp-clang-${AOSP_REV}-android-aarch64-ndk-${NDK_VERSION}-api${API}"
          echo "tar_name=$TAR_NAME" >> "$GITHUB_OUTPUT"

          cd "$(dirname "$INSTALL_DIR")"

          tar -c "$(basename "$INSTALL_DIR")" \
            | xz -T1 "-${XZ_LEVEL}" -v \
            > "$OUT_DIR/${TAR_NAME}.tar.xz"

          ls -lh "$OUT_DIR/${TAR_NAME}.tar.xz"

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.tar_name }}
          path: out/${{ steps.pack.outputs.tar_name }}.tar.xz
          retention-days: 7
          if-no-files-found: error

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ env.AOSP_REV }}-${{ env.NDK_VERSION }}
          path: |
            build-host-tools/CMakeCache.txt
            build-host-tools/CMakeFiles/CMakeOutput.log
            build-host-tools/CMakeFiles/CMakeError.log
            build-android/CMakeCache.txt
            build-android/CMakeFiles/CMakeOutput.log
            build-android/CMakeFiles/CMakeError.log
            build-android/**/*.log
          retention-days: 30
          if-no-files-found: ignore
