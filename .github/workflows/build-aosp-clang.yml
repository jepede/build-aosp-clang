name: 构建 AOSP Clang（Android arm64，NDK 可选）
run-name: 构建 AOSP Clang → aarch64-android（NDK ${{ inputs.ndk_version }}，${{ inputs.aosp_rev }}）

on:
  workflow_dispatch:
    inputs:
      ndk_version:
        description: "NDK 版本（如 r28c）"
        default: "r28c"
        required: true
      aosp_rev:
        description: "AOSP Clang 提交号（rXXXXXXx，如 r416183b）"
        default: "r416183b"
        required: true
      android_platform:
        description: "Android API（最低21，建议24+）"
        default: "30"
        required: true
      llvm_project_ref:
        description: "可选：toolchain/llvm-project 的分支/提交"
        default: ""
        required: false
      llvm_android_ref:
        description: "可选：toolchain/llvm_android 的分支/提交"
        default: ""
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ROOTDIR: ${{ github.workspace }}
      TARGET_TRIPLE: aarch64-linux-android
      INSTALL_DIR: ${{ github.workspace }}/stage/aarch64-linux-android
      BUILD_DIR: ${{ github.workspace }}/build
      SRC_DIR: ${{ github.workspace }}/src
      NDK_VERSION: ${{ inputs.ndk_version }}
    steps:
      - name: 最大化可用磁盘空间
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 4096
          swap-size-mb: 4096
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build cmake xz-utils unzip git curl file tree pkg-config jq patch

      - name: 下载并解压 NDK（${{ inputs.ndk_version }}）
        run: |
          set -eux
          curl -fsSL -o android-ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q android-ndk.zip -d "$ROOTDIR"
          rm -f android-ndk.zip
          ln -s "$ROOTDIR/android-ndk-${NDK_VERSION}" "$ROOTDIR/ndk"
          ls -la "$ROOTDIR/ndk"

      - name: 克隆 tomxi 脚本（build-aosp-clang-for-arm64）
        run: |
          set -eux
          mkdir -p "$SRC_DIR"
          git clone https://github.com/tomxi1997/build-aosp-clang-for-arm64.git "$SRC_DIR/tc-build"
          ls -la "$SRC_DIR/tc-build"

      - name: 克隆 AOSP 源（llvm-project / llvm_android）
        run: |
          set -eux
          git clone https://android.googlesource.com/toolchain/llvm-project "$SRC_DIR/llvm-project"
          git clone https://android.googlesource.com/toolchain/llvm_android "$SRC_DIR/llvm_android"
          echo "llvm-project @ $(git -C "$SRC_DIR/llvm-project" rev-parse --short HEAD)"
          echo "llvm_android @ $(git -C "$SRC_DIR/llvm_android" rev-parse --short HEAD)"

      - name: 解析 r 版本并自动应用补丁（纯 Shell + jq）
        env:
          AOSP_REV: ${{ inputs.aosp_rev }}
        run: |
          set -eux
          REV_NUM="$(echo "$AOSP_REV" | sed -E 's/^r([0-9]+).*/\1/')"
          test -n "$REV_NUM" || (echo "无法从 ${AOSP_REV} 解析 svn 版本号" && exit 1)
          echo "svn_version = $REV_NUM"

          PATCH_ROOT="$SRC_DIR/llvm_android/patches"
          PATCHES_JSON="$PATCH_ROOT/PATCHES.json"
          test -f "$PATCHES_JSON" || (echo "找不到 PATCHES.json: $PATCHES_JSON" && exit 1)

          git -C "$SRC_DIR/llvm-project" reset --hard
          git -C "$SRC_DIR/llvm-project" clean -fdx
          git -C "$SRC_DIR/llvm-project" config user.email "actions@github.com"
          git -C "$SRC_DIR/llvm-project" config user.name  "GitHub Actions"

          mapfile -t PATCHES < <(jq -r --argjson R "$REV_NUM" '
            .[] | . as $e
            | ( ($e.start_version // -1) <= $R and $R <= ($e.end_version // 99999999) )
            | if . then ($e.patch // $e.path // "") else "" end
            ' "$PATCHES_JSON" \
            | sed '/^$/d' \
            | while read -r p; do
                [ -f "$PATCH_ROOT/$p" ] && echo "$p" || true
              done)

          echo "将应用补丁数量：${#PATCHES[@]}"
          for p in "${PATCHES[@]}"; do
            PP="$PATCH_ROOT/$p"
            echo ">> 应用补丁: $p"
            if git -C "$SRC_DIR/llvm-project" am --keep-cr "$PP"; then
              continue
            else
              git -C "$SRC_DIR/llvm-project" am --abort || true
              patch -p1 --forward --input="$PP" -d "$SRC_DIR/llvm-project"
            fi
          done

      - name: 使用 build-llvm.py 构建（与 tomxi 的 build.sh 同路数）
        env:
          INSTALL_DIR: ${{ env.INSTALL_DIR }}
        run: |
          set -eux
          cd "$SRC_DIR/tc-build"
          # 直接照你贴的参数来；安装目录可换成你喜欢的名字
          python3 build-llvm.py \
            --vendor-string "Pdx" \
            --targets "ARM AArch64" \
            --projects "clang lld" \
            --build-stage1-only \
            --no-update \
            -i "$INSTALL_DIR/clang-${{ inputs.aosp_rev }}"

          tree -L 2 "$INSTALL_DIR" || true

      - name: 打包
        id: pack
        run: |
          TAR_NAME="aosp-clang-${{ inputs.aosp_rev }}-host-linux-x86_64"
          echo "tar_name=${TAR_NAME}" >> "$GITHUB_OUTPUT"
          mkdir -p "$ROOTDIR/out"
          (cd "$(dirname "$INSTALL_DIR")" && tar -c "$(basename "$INSTALL_DIR")") | xz -T0 -v > "$ROOTDIR/out/${TAR_NAME}.tar.xz"
          ls -lh "$ROOTDIR/out/${TAR_NAME}.tar.xz"

      - name: 上传构建产物到 Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.tar_name }}
          path: out/${{ steps.pack.outputs.tar_name }}.tar.xz
          retention-days: 7
