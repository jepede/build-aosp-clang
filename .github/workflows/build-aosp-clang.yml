name: 构建 AOSP Clang（Android arm64，NDK 可选）
run-name: 构建 AOSP Clang → aarch64-android（NDK ${{ inputs.ndk_version }}，${{ inputs.aosp_rev }}）

on:
  workflow_dispatch:
    inputs:
      ndk_version:
        description: "NDK 版本（如 r28c）"
        default: "r28c"
        required: true
      aosp_rev:
        description: "AOSP Clang 提交号（rXXXXXXx，如 r416183b）"
        default: "r416183b"
        required: true
      android_platform:
        description: "Android API（最低21，建议24+）"
        default: "30"
        required: true
      llvm_project_ref:
        description: "可选：toolchain/llvm-project 的分支/提交"
        default: ""
        required: false
      llvm_android_ref:
        description: "可选：toolchain/llvm_android 的分支/提交"
        default: ""
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # ↑ 提高总超时时间，避免长时间编译被系统裁掉
    timeout-minutes: 360
    env:
      ROOTDIR: ${{ github.workspace }}
      TARGET_TRIPLE: aarch64-linux-android
      INSTALL_DIR: ${{ github.workspace }}/stage/aarch64-linux-android
      BUILD_DIR: ${{ github.workspace }}/build
      SRC_DIR: ${{ github.workspace }}/src
      NDK_VERSION: ${{ inputs.ndk_version }}
      # ↓ 统一限制并行；Ninja 仍再加 -j/-l 双保险
      CMAKE_BUILD_PARALLEL_LEVEL: 3
    steps:
      - name: 最大化可用磁盘空间与 Swap
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 4096
          swap-size-mb: 12288     # ↑ 12G，抗内存峰值
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: 资源自检（磁盘/内存/句柄）
        run: |
          set -eux
          df -h
          free -h || true
          ulimit -n 1048576 || true

      - name: 检出当前仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: 安装依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build cmake xz-utils unzip git curl file tree pkg-config jq patch ccache

      # ↓ ccache 缓存：失败后二次构建基本“秒补”
      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-aosp-llvm-${{ hashFiles('**/CMakeLists.txt','**/*.cmake') }}-${{ inputs.aosp_rev }}-${{ inputs.ndk_version }}
          restore-keys: |
            ${{ runner.os }}-ccache-aosp-llvm-

      - name: 启用 ccache
        uses: hendrikmuhs/ccache-action@v1.2.18
        with:
          key: aosp-llvm

      - name: 下载并解压 NDK（${{ inputs.ndk_version }}）
        run: |
          set -eux
          curl -fsSL -o android-ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q android-ndk.zip -d "$ROOTDIR"
          rm -f android-ndk.zip
          ln -s "$ROOTDIR/android-ndk-${NDK_VERSION}" "$ROOTDIR/ndk"
          ls -la "$ROOTDIR/ndk"

      - name: 克隆 AOSP 源码（llvm-project / llvm_android）
        run: |
          set -eux
          mkdir -p "$SRC_DIR"
          git clone --depth 1 https://android.googlesource.com/toolchain/llvm-project "$SRC_DIR/llvm-project"
          if [ -n "${{ inputs.llvm_project_ref }}" ]; then
            git -C "$SRC_DIR/llvm-project" fetch --depth 1 origin "${{ inputs.llvm_project_ref }}"
            git -C "$SRC_DIR/llvm-project" checkout FETCH_HEAD
          fi
          git clone --depth 1 https://android.googlesource.com/toolchain/llvm_android "$SRC_DIR/llvm_android"
          if [ -n "${{ inputs.llvm_android_ref }}" ]; then
            git -C "$SRC_DIR/llvm_android" fetch --depth 1 origin "${{ inputs.llvm_android_ref }}"
            git -C "$SRC_DIR/llvm_android" checkout FETCH_HEAD
          fi
          echo "llvm-project @ $(git -C "$SRC_DIR/llvm-project" rev-parse --short HEAD)"
          echo "llvm_android @ $(git -C "$SRC_DIR/llvm_android" rev-parse --short HEAD)"

      - name: 解析 r 版本并自动应用补丁（纯 Shell + jq）
        env:
          AOSP_REV: ${{ inputs.aosp_rev }}
        run: |
          set -eux
          REV_NUM="$(echo "$AOSP_REV" | sed -E 's/^r([0-9]+).*/\1/')"
          test -n "$REV_NUM" || (echo "无法从 ${AOSP_REV} 解析 svn 版本号" && exit 1)
          echo "svn_version = $REV_NUM"

          PATCH_ROOT="$SRC_DIR/llvm_android/patches"
          PATCHES_JSON="$PATCH_ROOT/PATCHES.json"
          test -f "$PATCHES_JSON" || (echo "找不到 PATCHES.json: $PATCHES_JSON" && exit 1)

          git -C "$SRC_DIR/llvm-project" reset --hard
          git -C "$SRC_DIR/llvm-project" clean -fdx
          git -C "$SRC_DIR/llvm-project" config user.email "actions@github.com"
          git -C "$SRC_DIR/llvm-project" config user.name  "GitHub Actions"

          mapfile -t PATCHES < <(jq -r --argjson R "$REV_NUM" '
            .[] | . as $e
            | ( ($e.start_version // -1) <= $R and $R <= ($e.end_version // 99999999) )
            | if . then ($e.patch // $e.path // "") else "" end
            ' "$PATCHES_JSON" \
            | sed '/^$/d' \
            | while read -r p; do
                [ -f "$PATCH_ROOT/$p" ] && echo "$p" || true
              done)

          echo "将应用补丁数量：${#PATCHES[@]}"
          for p in "${PATCHES[@]}"; do
            PP="$PATCH_ROOT/$p"
            echo ">> 应用补丁: $p"
            if git -C "$SRC_DIR/llvm-project" am --keep-cr "$PP"; then
              continue
            else
              git -C "$SRC_DIR/llvm-project" am --abort || true
              patch -p1 --forward --input="$PP" -d "$SRC_DIR/llvm-project"
            fi
          done

      - name: 配置（CMake + NDK 交叉构建到 aarch64-android）
        env:
          ANDROID_NDK_HOME: ${{ github.workspace }}/ndk
          ANDROID_NDK_ROOT: ${{ github.workspace }}/ndk
        run: |
          set -eux
          API="${{ inputs.android_platform }}"
          TOOLCHAIN="$ROOTDIR/ndk/toolchains/llvm/prebuilt/linux-x86_64"
          export CC="${TOOLCHAIN}/bin/${TARGET_TRIPLE}${API}-clang"
          export CXX="${TOOLCHAIN}/bin/${TARGET_TRIPLE}${API}-clang++"
          export AR="${TOOLCHAIN}/bin/llvm-ar"
          export RANLIB="${TOOLCHAIN}/bin/llvm-ranlib"
          export STRIP="${TOOLCHAIN}/bin/llvm-strip"
          export LD="${TOOLCHAIN}/bin/ld.lld"

          mkdir -p "$BUILD_DIR" "$INSTALL_DIR"
          cmake -S "$SRC_DIR/llvm-project/llvm" -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ROOTDIR/ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="${API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_ENABLE_ZLIB=ON \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_BACKTRACES=OFF \
            -DLLVM_USE_LINKER=lld \
            -DLLVM_PARALLEL_LINK_JOBS=1 \  # ↓ 链接阶段强行单并发，防 OOM
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS="-fvisibility=hidden -fdata-sections -ffunction-sections" \
            -DCMAKE_CXX_FLAGS="-fvisibility=hidden -fdata-sections -ffunction-sections" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--gc-sections -latomic" \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,--gc-sections -latomic"

      # ↓ keepalive 心跳日志，避免“长时间无输出”被判掉线
      - name: 构建并安装（分步 + 限并行 + 心跳）
        timeout-minutes: 330
        run: |
          set -eux
          ( while true; do echo "::notice::keepalive $(date)"; sleep 60; done ) &

          # Ninja 双保险：-j3 -l3；单目标分步构建与重试
          ninja -C "$BUILD_DIR" -j3 -l3 clang || ninja -C "$BUILD_DIR" -j2 -l2 clang
          ninja -C "$BUILD_DIR" -j3 -l3 lld   || ninja -C "$BUILD_DIR" -j2 -l2 lld

          cmake --install "$BUILD_DIR" --component clang || true
          cmake --install "$BUILD_DIR" --component lld   || true
          cmake --install "$BUILD_DIR" || true

          if [ -d "$INSTALL_DIR/bin" ]; then
            find "$INSTALL_DIR/bin" -type f -maxdepth 1 -print0 | while IFS= read -r -d '' f; do
              if file "$f" | grep -q ELF; then
                "$ROOTDIR/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" -s "$f" || true
              fi
            done
          fi
          tree -L 3 "$INSTALL_DIR" || true

      - name: 打包
        id: pack
        run: |
          set -eux
          API="${{ inputs.android_platform }}"
          TAR_NAME="aosp-clang-${{ inputs.aosp_rev }}-android-aarch64-ndk-${NDK_VERSION}-api${API}"
          echo "tar_name=${TAR_NAME}" >> "$GITHUB_OUTPUT"
          mkdir -p "$ROOTDIR/out"
          (cd "$(dirname "$INSTALL_DIR")" && tar -c "$(basename "$INSTALL_DIR")") | xz -T0 -v > "$ROOTDIR/out/${TAR_NAME}.tar.xz"
          ls -lh "$ROOTDIR/out/${TAR_NAME}.tar.xz"

      - name: 上传构建产物到 Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.tar_name }}
          path: out/${{ steps.pack.outputs.tar_name }}.tar.xz
          retention-days: 7

      # ↓ 失败时把日志打包，方便二次定位（永远执行）
      - name: 采集构建日志（失败辅助）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ env.BUILD_DIR }}/CMakeCache.txt
            ${{ env.BUILD_DIR }}/CMakeFiles
            ${{ env.BUILD_DIR }}/tools/**/CMakeFiles/**/build.make
            ${{ env.BUILD_DIR }}/**/*.log
          retention-days: 3
