name: Build official-source NDK Linux ARM64

run-name: NDK r28c Linux ARM64 host

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: Ninja parallel jobs on the ARM64 runner
        required: true
        default: "2"

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: ndk-r28c-linux-arm64
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      JOBS: ${{ inputs.jobs }}
      ROOTDIR: ${{ github.workspace }}
      OUT_DIR: ${{ github.workspace }}/out

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          submodules: false

      - name: Validate runner and inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(uname -m)" = aarch64
          case "$JOBS" in ''|*[!0-9]*) exit 1;; esac
          test "$JOBS" -ge 1
          test "$JOBS" -le 4
          df -h
          free -h

      - name: Install Ubuntu build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake git jq make ninja-build patch unzip xz-utils curl file yasm python3 \
            libz-dev libzstd-dev

      - name: Build ARM64-hosted NDK
        shell: bash
        run: |
          set -Eeuo pipefail
          scripts/build-ndk-arm64.sh

      - name: Attest NDK artifact provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: out/android-ndk-r28c-linux-arm64.tar.xz

      - name: Upload NDK and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-ndk-r28c-linux-arm64
          path: |
            out/android-ndk-r28c-linux-arm64.tar.xz
            out/android-ndk-r28c-linux-arm64.manifest.txt
          if-no-files-found: error
          retention-days: 30
