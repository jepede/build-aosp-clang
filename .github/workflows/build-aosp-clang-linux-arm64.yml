name: Build AOSP Clang 12 Linux ARM64

run-name: AOSP r416183b / 7284624 sources -> Linux ARM64

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-aosp-clang-linux-arm64.yml
      - scripts/build-aosp-clang-linux-arm64.sh
      - scripts/smoke-clang-linux-arm64.py
      - AOSP_CLANG_LINUX_ARM64.md
  workflow_dispatch:
    inputs:
      ninja_jobs:
        description: Native ARM64 build jobs (1-4)
        default: "4"
        required: true

permissions:
  contents: read

concurrency:
  group: aosp-clang-r416183b-linux-arm64
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 360
    env:
      JOBS: ${{ inputs.ninja_jobs || '4' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache-linux-arm64
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install native Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-11 g++-11 binutils cmake ninja-build ccache \
            git curl ca-certificates python3 xz-utils zlib1g-dev file patch

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache-linux-arm64
          key: aosp-r416183b-linux-arm64-${{ hashFiles('scripts/build-aosp-clang-linux-arm64.sh') }}
          restore-keys: aosp-r416183b-linux-arm64-

      - name: Build and verify the native toolchain
        env:
          CC: gcc-11
          CXX: g++-11
        run: |
          set -o pipefail
          bash scripts/build-aosp-clang-linux-arm64.sh 2>&1 | tee build-linux-arm64.log

      - name: Upload checksum and part manifest
        uses: actions/upload-artifact@v4
        with:
          name: aosp-clang-r416183b-linux-aarch64-manifest
          path: |
            out/aosp-clang-r416183b-7284624-linux-aarch64.tar.xz.sha256
            out/aosp-clang-r416183b-7284624-linux-aarch64.tar.xz.size
            out/aosp-clang-r416183b-7284624-linux-aarch64.tar.xz.parts.sha256
          if-no-files-found: error
          retention-days: 400
          compression-level: 0

      - name: Upload toolchain part 00
        uses: actions/upload-artifact@v4
        with:
          name: aosp-clang-r416183b-linux-aarch64-part-00
          path: out/aosp-clang-r416183b-7284624-linux-aarch64.tar.xz.part.00
          if-no-files-found: error
          retention-days: 400
          compression-level: 0

      - name: Upload toolchain part 01
        if: ${{ hashFiles('out/aosp-clang-r416183b-7284624-linux-aarch64.tar.xz.part.01') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: aosp-clang-r416183b-linux-aarch64-part-01
          path: out/aosp-clang-r416183b-7284624-linux-aarch64.tar.xz.part.01
          if-no-files-found: error
          retention-days: 400
          compression-level: 0

      - name: Upload toolchain part 02
